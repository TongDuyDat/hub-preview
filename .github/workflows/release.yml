name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      draft:
        description: Create a draft release
        type: boolean
        default: false
      prerelease:
        description: Create a pre-release
        type: boolean
        default: false
      include_jetbrains:
        description: Also build and attach the unchanged JetBrains plugin
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-release:
    name: Test, package and release VS Code and MCP
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check release versions
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = require('./package.json').version;
          for (const file of ['./core/package.json', './mcp/package.json', './vscode/package.json']) {
            if (require(file).version !== version) throw new Error('Version mismatch: ' + file);
          }
          const tag = 'v' + version;
          if (process.env.REF_TYPE === 'tag' && process.env.REF_NAME !== tag) {
            throw new Error('Release tag must match package version: ' + tag);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'release_tag=' + tag + '\n');
          NODE

      - name: Install Node dependencies
        run: npm ci

      - name: Build and package VS Code extension
        run: npm run package:vscode

      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test

      - name: Package MCP for manual npm publication
        run: npm run pack:mcp

      - name: Setup Java 21
        if: inputs.include_jetbrains == true
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        if: inputs.include_jetbrains == true
        uses: gradle/actions/setup-gradle@v4

      - name: Package optional JetBrains plugin
        if: inputs.include_jetbrains == true
        run: |
          chmod +x jetbrains/gradlew
          cd jetbrains
          ./gradlew buildPlugin

      - name: Generate checksums
        run: |
          mkdir -p release
          cp vscode/*.vsix mcp/*.tgz release/
          if [ -d jetbrains/build/distributions ]; then
            find jetbrains/build/distributions -name '*.zip' -exec cp {} release/ \;
          fi
          cd release
          sha256sum *.vsix *.tgz > SHA256SUMS.txt
          if compgen -G '*.zip' > /dev/null; then sha256sum *.zip >> SHA256SUMS.txt; fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: review-hub-${{ steps.meta.outputs.release_tag }}
          path: release/*
          if-no-files-found: error

      # Pushes to main validate code; only a version tag or a manual run publishes.
      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Review Hub ${{ steps.meta.outputs.release_tag }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release/*
