name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag/Release version (leave empty to use package.json version)'
        required: false
        default: ''
      draft:
        description: 'Create as draft'
        type: boolean
        default: false
      prerelease:
        description: 'Create as pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Extension and Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version and set tag
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "release_tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release_tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "release_tag=v$VERSION" >> $GITHUB_OUTPUT
          fi

      - name: Install Node dependencies
        run: npm ci

      - name: Typecheck & Test
        run: |
          npm run typecheck
          npm test

      - name: Build Core & Bundles
        run: npm run build

      - name: Package VS Code Extension (.vsix)
        run: npm run package

      - name: Package JetBrains Plugin (.zip)
        run: |
          chmod +x jetbrains/gradlew
          cd jetbrains && ./gradlew buildPlugin

      - name: Upload Artifacts to Actions Run
        uses: actions/upload-artifact@v4
        with:
          name: review-hub-artifacts
          path: |
            *.vsix
            jetbrains/build/distributions/*.zip

      - name: Create or Update GitHub Release
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.release_tag }}
          name: Review Hub ${{ steps.meta.outputs.release_tag }}
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || (github.ref_type != 'tag' && github.event_name != 'workflow_dispatch') }}
          generate_release_notes: true
          files: |
            *.vsix
            jetbrains/build/distributions/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

